services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      # The SQLite database file lives in this directory (mounted as a volume).
      DB_PATH: /app/data/splitbasic.db
    volumes:
      - splitbasic-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/trips').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  splitbasic-data:
